# Infrastructure locale ZAHFIT (ports décalés pour ne pas entrer en conflit
# avec d'autres projets : Postgres 5442, Redis 6390).
services:
  postgres:
    image: postgres:16-alpine
    container_name: zahfit_postgres
    environment:
      POSTGRES_USER: zahfit_owner
      POSTGRES_PASSWORD: zahfit_owner_dev
      POSTGRES_DB: zahfit
      TZ: UTC
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - zahfit_pg:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zahfit_owner -d zahfit"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zahfit_redis
    ports:
      - "127.0.0.1:6390:6379"

volumes:
  zahfit_pg:
